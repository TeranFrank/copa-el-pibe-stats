:root{

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

.hero-text{min-width:0;}

.hero .sub{color:var(--muted);font-size:13px;padding-bottom:18px;}
.tabs-wrap{position:relative;}
.tabs-wrap::after{content:'';position:absolute;top:0;right:0;bottom:0;width:28px;background:linear-gradient(90deg, transparent, var(--bg));pointer-events:none;opacity:1;transition:opacity .2s ease;}

nav.tabs button{
  background:none;border:none;color:var(--muted);font-family:'Oswald',sans-serif;
  font-size:15px;text-transform:uppercase;letter-spacing:.03em;padding:12px 14px;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s ease,border-color .15s ease;
}
nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent);}
@media (hover:hover){ nav.tabs button:hover{color:var(--text);} }
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
section.panel{padding:28px 0;}
section.panel.panel-anim{animation:fadeInUp .35s ease both;}
table{width:100%;border-collapse:collapse;font-size:14px;}

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

.team-logo,.team-logo-sm,.team-logo-md,.team-logo-lg,.destacado-team-badge{border-radius:9px;object-fit:contain;display:inline-block;vertical-align:middle;background:var(--panel-2);border:1px solid var(--line);flex:none;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.team-logo:hover,.team-logo-sm:hover,.team-logo-md:hover,.team-logo-lg:hover{transform:scale(1.09);box-shadow:0 0 0 2px var(--accent),0 6px 14px rgba(0,0,0,.4);border-color:var(--accent);z-index:2;position:relative;}

.team-logo{width:56px;height:56px;padding:3px;}

.team-logo-lg{width:84px;height:84px;padding:5px;border-radius:12px;animation:logoPop .45s cubic-bezier(.34,1.56,.64,1) both,glowPulse 2.4s ease-in-out .45s infinite;}

.destacados-formacion{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--yellow);letter-spacing:.05em;margin:2px 0 0;}

.footer-copy{color:var(--muted);font-size:12px;}
.like-widget{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;}
.like-btn{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .15s ease,border-color .15s ease;}
.like-btn #like-heart{font-size:16px;}

document.head.insertAdjacentHTML('beforeend', FONT_LINKS + '<style>' + STYLE_CSS + '</style>');

try{
  var __ua = navigator.userAgent || '';
  var __uaMobile = /iPhone|iPod|Android|Mobile|Windows Phone|BlackBerry|Opera Mini|IEMobile|iPad|Macintosh.*Mobile/i.test(__ua)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS reports as Mac but has touch

  // which some in-app browsers like WhatsApp's report incorrectly). Default is "phone"

  var __isDesktop = !__uaMobile;
  if(__isDesktop) document.documentElement.classList.add('is-desktop-html');
}catch(e){}

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function loadState(){
  try { return JSON.parse(document.getElementById('state-data').textContent); }
  catch(e){ return {torneo:'Mi Campeonato', equipos:[], fechas:[], logo:null}; }
}

function initials(name){
  if(!name) return '?';
  var parts = name.trim().split(/\s+/).filter(Boolean);
  var letters = parts.slice(0,2).map(function(w){ return w[0]; }).join('');
  return (letters || '?').toUpperCase();
}

function teamAvatar(team, cls){
  if(!team) return '<span class="'+cls+' avatar-fallback">?</span>';
  if(team.escudo){
    return '<img class="'+cls+'" src="'+team.escudo+'" alt="'+escapeHtml(team.nombre)+'" title="'+escapeHtml(team.nombre)+'">';
  }
  return '<span class="'+cls+' avatar-fallback" title="'+escapeHtml(team.nombre)+'" aria-label="'+escapeHtml(team.nombre)+'">'+escapeHtml(initials(team.nombre))+'</span>';
}

var STATE = loadState();
STATE.equipos = STATE.equipos || [];
STATE.fechas = STATE.fechas || [];
document.title = (STATE.torneo || 'Campeonato') + ' — Estadísticas';

var TAB = 'posiciones';
var PREV_TAB = null;
var CAN_EDIT = false;
var DIRTY = false;
var ADMIN_OPEN = {};

function computeStandings(state){
  var map = {};
  (state.equipos||[]).forEach(function(e){
    map[e.id] = {id:e.id, nombre:e.nombre, escudo:e.escudo||null, pj:0,pg:0,pe:0,pp:0,gf:0,gc:0};
  });
  (state.fechas||[]).forEach(function(f){
    (f.partidos||[]).forEach(function(p){
      if(p.golesLocal==null || p.golesVisitante==null) return;
      var L = map[p.localId], V = map[p.visitanteId];
      if(!L||!V) return;
      var gl = Number(p.golesLocal), gv = Number(p.golesVisitante);
      L.pj++; V.pj++;
      L.gf+=gl; L.gc+=gv;
      V.gf+=gv; V.gc+=gl;
      if(gl>gv){ L.pg++; V.pp++; }
      else if(gl<gv){ V.pg++; L.pp++; }
      else { L.pe++; V.pe++; }
    });
  });
  var arr = Object.keys(map).map(function(k){
    var t = map[k];
    t.dg = t.gf - t.gc;
    t.pts = t.pg*3 + t.pe;
    return t;
  });
  arr.sort(function(a,b){
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.dg!==a.dg) return b.dg-a.dg;
    if(b.gf!==a.gf) return b.gf-a.gf;
    return a.nombre.localeCompare(b.nombre);
  });
  return arr;
}

function computeScorers(state){
  var map = {}, teamName = {};
  (state.equipos||[]).forEach(function(e){teamName[e.id]=e.nombre;});
  (state.fechas||[]).forEach(function(f){
    (f.partidos||[]).forEach(function(p){
      (p.goleadores||[]).forEach(function(g){
        var key = g.jugador.trim().toLowerCase()+'|'+g.equipoId;
        if(!map[key]) map[key]={jugador:g.jugador, equipoId:g.equipoId, goles:0};
        map[key].goles += Number(g.cantidad||1);
      });
    });
  });
  var arr = Object.keys(map).map(function(k){ return map[k]; });
  arr.forEach(function(x){ x.equipoNombre = teamName[x.equipoId] || '—'; });
  arr.sort(function(a,b){ if(b.goles!==a.goles) return b.goles-a.goles; return a.jugador.localeCompare(b.jugador); });
  return arr;
}

function computeCards(state){
  var map = {}, teamName = {};
  (state.equipos||[]).forEach(function(e){teamName[e.id]=e.nombre;});
  (state.fechas||[]).forEach(function(f){
    (f.partidos||[]).forEach(function(p){
      (p.tarjetas||[]).forEach(function(t){
        var key = t.jugador.trim().toLowerCase()+'|'+t.equipoId;
        if(!map[key]) map[key]={jugador:t.jugador, equipoId:t.equipoId, amarillas:0, rojas:0};
        if(t.tipo==='roja') map[key].rojas += Number(t.cantidad||1);
        else map[key].amarillas += Number(t.cantidad||1);
      });
    });
  });
  var arr = Object.keys(map).map(function(k){ return map[k]; });
  arr.forEach(function(x){ x.equipoNombre = teamName[x.equipoId] || '—'; });
  arr.sort(function(a,b){
    if(b.rojas!==a.rojas) return b.rojas-a.rojas;
    if(b.amarillas!==a.amarillas) return b.amarillas-a.amarillas;
    return a.jugador.localeCompare(b.jugador);
  });
  return arr;
}

function renderStandings(state){
  var rows = computeStandings(state);
  if(!rows.length) return '<p class="empty">Todavía no hay equipos cargados.</p>';
  var body = rows.map(function(t,i){
    return '<tr class="'+(i<3?'top3':'')+'">'
      + '<td class="num">'+(i+1)+'</td>'
      + '<td class="team-name"><div class="equipo-col">'+teamAvatar(t,'team-logo')+'<span class="name-full">'+escapeHtml(t.nombreCorto||t.nombre)+'</span><span class="name-mobile">'+escapeHtml(t.nombreMobil||t.nombreCorto||t.nombre)+'</span></div></td>'
      + '<td class="num">'+t.pj+'</td>'
      + '<td class="num">'+t.pg+'</td>'
      + '<td class="num">'+t.pe+'</td>'
      + '<td class="num">'+t.pp+'</td>'
      + '<td class="num">'+t.gf+'</td>'
      + '<td class="num">'+t.gc+'</td>'
      + '<td class="num">'+(t.dg>0?'+':'')+t.dg+'</td>'
      + '<td class="num"><strong>'+t.pts+'</strong></td>'
      + '</tr>';
  }).join('');
  return '<div class="tablewrap"><table><thead><tr><th class="num">#</th><th>Equipo</th><th class="num">PJ</th><th class="num">PG</th>'
    + '<th class="num">PE</th><th class="num">PP</th><th class="num">GF</th><th class="num">GC</th>'
    + '<th class="num">DG</th><th class="num">Pts</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

function buildEventsCol(p, equipoId){
  var goles = (p.goleadores||[]).filter(function(g){ return g.equipoId===equipoId; })
    .slice().sort(function(a,b){ return (Number(b.cantidad)||1) - (Number(a.cantidad)||1); });
  var tarjetas = (p.tarjetas||[]).filter(function(t){ return t.equipoId===equipoId; });
  var lines = [];
  goles.forEach(function(g){
    lines.push('<div class="event-line">⚽ '+escapeHtml(g.jugador)+(g.cantidad>1?' x'+g.cantidad:'')+'</div>');
  });
  tarjetas.forEach(function(t){
    lines.push('<div class="event-line"><span class="badge '+t.tipo+'"></span>'+escapeHtml(t.jugador)+'</div>');
  });
  return lines.join('');
}

function renderFixtures(state){
  var fechas = (state.fechas||[]).slice().sort(function(a,b){ return (b.numero||0) - (a.numero||0); });
  if(!fechas.length) return '<p class="empty">Todavía no hay resultados cargados.</p>';
  var teamObj = {};
  (state.equipos||[]).forEach(function(e){teamObj[e.id]=e;});
  var blocks = fechas.map(function(f){
    var jugados = (f.partidos||[]).filter(function(p){ return p.golesLocal!=null && p.golesVisitante!=null; });
    if(!jugados.length) return '';
    var partidos = jugados.map(function(p){
      var local = teamObj[p.localId], visit = teamObj[p.visitanteId];
      var scoreHtml = '<span class="score">'+p.golesLocal+' — '+p.golesVisitante+'</span>';
      var localLabel = local ? (local.nombreCorto || local.nombre) : '?';
      var visitLabel = visit ? (visit.nombreCorto || visit.nombre) : '?';
      var localMobil = local ? (local.nombreMobil || localLabel) : '?';
      var visitMobil = visit ? (visit.nombreMobil || visitLabel) : '?';
      var localEvents = buildEventsCol(p, p.localId);
      var visitEvents = buildEventsCol(p, p.visitanteId);
      var eventsHtml = (localEvents || visitEvents) ? (
        '<div class="partido-events">'
        + '<div class="events-col">'+localEvents+'</div>'
        + '<div class="events-col right">'+visitEvents+'</div>'
        + '</div>'
      ) : '';
      return '<div class="partido-wrap"><div class="partido">'
        + '<div class="equipo-col">'+teamAvatar(local,'team-logo-sm')+'<span class="name-full">'+escapeHtml(localLabel)+'</span><span class="name-mobile">'+escapeHtml(localMobil)+'</span></div>'
        + scoreHtml
        + '<div class="equipo-col right">'+teamAvatar(visit,'team-logo-sm')+'<span class="name-full">'+escapeHtml(visitLabel)+'</span><span class="name-mobile">'+escapeHtml(visitMobil)+'</span></div>'
        + '</div>' + eventsHtml + '</div>';
    }).join('');
    return '<div class="fecha-block"><h3 class="fecha-title">Fecha '+f.numero+'</h3>'+partidos+'</div>';
  }).filter(Boolean);
  if(!blocks.length) return '<p class="empty">Todavía no hay resultados cargados.</p>';
  return blocks.join('');
}

function renderScorers(state){
  var rows = computeScorers(state);
  if(!rows.length) return '<p class="empty">Todavía no hay goles cargados.</p>';
  var teamObj = {};
  (state.equipos||[]).forEach(function(e){teamObj[e.id]=e;});
  var body = rows.map(function(s,i){
    var t = teamObj[s.equipoId];
    return '<tr><td class="num">'+(i+1)+'</td><td>'+escapeHtml(s.jugador)+'</td>'
      + '<td class="team-name">'+teamAvatar(t,'team-logo-md')+'</td>'
      + '<td class="num"><strong>'+s.goles+'</strong></td></tr>';
  }).join('');
  return '<div class="tablewrap"><table class="table-compact"><thead><tr><th class="num">#</th><th>Jugador</th><th>Equipo</th><th class="num">Goles</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

var PLAYER_SILHOUETTE_SVG = '<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true"><circle cx="50" cy="36" r="19" fill="currentColor"/><path d="M50 60c-23 0-37 13-37 29v6h74v-6c0-16-14-29-37-29z" fill="currentColor"/></svg>';

function renderCapillaBanner(state){
  var rows = computeCards(state);
  var enCapilla = rows.filter(function(r){ return r.amarillas>0 && r.amarillas%3===2; });
  if(!enCapilla.length) return '';
  var teamObj = {};
  (state.equipos||[]).forEach(function(e){ teamObj[e.id]=e; });
  var cards = enCapilla.map(function(r){
    var team = teamObj[r.equipoId];
    return '<div class="capilla-card">'
      + '<div class="capilla-avatar-row"><div class="destacado-photo placeholder capilla-silueta">'+PLAYER_SILHOUETTE_SVG+'</div>'+teamAvatar(team,'team-logo-lg')+'</div>'
      + '<div class="destacado-name">'+escapeHtml(r.jugador)+'</div>'
      + '<div class="capilla-count">'+r.amarillas+' amarillas</div>'
      + '</div>';
  }).join('');
  return '<div class="capilla-banner">'
    + '<h3 class="capilla-title">🟨 En capilla</h3>'

    + '</div>';
}

function renderCards(state){
  var rows = computeCards(state);
  if(!rows.length) return '<p class="empty">Todavía no hay tarjetas cargadas.</p>';

function renderProximosPartidos(state){
  var maxFechaCreada = (state.fechas||[]).reduce(function(m,f){ return Math.max(m, f.numero||0); }, 0);
  var total = state.totalFechas || maxFechaCreada;
  if(!total){
    return '<p class="empty">Cargá el total de fechas del torneo desde "Editar" para armar esta vista.</p>';
  }
  var teamObj = {};
  (state.equipos||[]).forEach(function(e){ teamObj[e.id]=e; });
  var tabla = {};
  computeStandings(state).forEach(function(t){ tabla[t.id]=t; });

  function coef(p){
    var tA = tabla[p.localId], tB = tabla[p.visitanteId];
    var pts = (tA?tA.pts:0) + (tB?tB.pts:0);
    var dg = (tA?tA.dg:0) + (tB?tB.dg:0);
    var gf = (tA?tA.gf:0) + (tB?tB.gf:0);
    return {pts:pts, dg:dg, gf:gf};
  }

  var fechas = (state.fechas||[]).filter(function(f){
    return f.numero <= total && (f.partidos||[]).some(function(p){ return p.golesLocal==null || p.golesVisitante==null; });
  }).sort(function(a,b){ return a.numero-b.numero; });

  if(!fechas.length){
    return '<p class="empty">Todavía no cargaste los cruces de las próximas fechas desde "Editar".</p>';
  }

  return fechas.map(function(f){
    var pendientes = (f.partidos||[]).filter(function(p){ return p.golesLocal==null || p.golesVisitante==null; });
    pendientes.sort(function(a,b){
      var ca = coef(a), cb = coef(b);
      if(ca.pts !== cb.pts) return ca.pts - cb.pts;
      if(ca.dg !== cb.dg) return ca.dg - cb.dg;
      return ca.gf - cb.gf;
    });
    var dateLabel = fechaDateLabel(f.numero, state);
    var partidosHtml = pendientes.map(function(p, idx){
      var local = teamObj[p.localId], visit = teamObj[p.visitanteId];
      return '<div class="proximo-partido"><div class="proximo-avatares">'
        + teamAvatar(local,'team-logo-lg')
        + '<span class="proximo-vs">VS</span>'
        + teamAvatar(visit,'team-logo-lg')
        + '</div><span class="proximo-hora">'+formatMatchTime(idx)+'</span></div>';
    }).join('');
    return '<div class="fecha-block"><h3 class="fecha-title">Fecha '+f.numero+(dateLabel?' <span class="fecha-date">— '+escapeHtml(dateLabel)+'</span>':'')+'</h3><div class="proximos-grid">'+partidosHtml+'</div></div>';
  }).join('');
}

function fechaDateLabel(numero, state){
  var base = state.fechaBase;
  if(!base || !base.numero || !base.fecha) return '';
  var parts = String(base.fecha).split('-');
  if(parts.length!==3) return '';
  var baseDate = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  if(isNaN(baseDate.getTime())) return '';
  var diffWeeks = numero - base.numero;
  var d = new Date(baseDate.getTime() + diffWeeks*7*24*60*60*1000);
  var dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return dias[d.getDay()] + ' ' + d.getDate() + ' de ' + meses[d.getMonth()];
}

function formatMatchTime(idx){
  var total = 20*60 + idx*40;
  var h24 = Math.floor(total/60) % 24;
  var m = total % 60;
  var ampm = h24>=12 ? 'PM' : 'AM';
  var h12 = h24 % 12; if(h12===0) h12=12;
  return h12 + ':' + (m<10?'0':'') + m + ' ' + ampm;
}

function renderLiguilla(state){
  var standings = computeStandings(state);
  if(standings.length < 2){
    return '<p class="empty">Todavía no hay suficientes equipos en la tabla para armar la liguilla.</p>';
  }
  var teamObj = {};
  (state.equipos||[]).forEach(function(e){ teamObj[e.id]=e; });

  var big = standings.slice(0,8);
  var small = standings.slice(8);
  var html = '';

  html += '<h3 class="fecha-title">Liguilla grande (1° al 8°)</h3>';
  if(big.length < 8){
    html += '<p class="empty">Se arma cuando haya al menos 8 equipos en la tabla (hay '+standings.length+').</p>';
  } else {
    var pairs = [[0,7],[1,6],[2,5],[3,4]];
    html += '<div class="bracket-grid">' + pairs.map(function(pr){
      return renderCruce(teamObj, big[pr[0]], pr[0]+1, big[pr[1]], pr[1]+1);
    }).join('') + '</div>';
  }

  html += '<h3 class="fecha-title" style="margin-top:26px">Liguilla chica (9° y 10°)</h3>';
  if(small.length < 2){
    html += '<p class="empty">Se arma cuando haya al menos 10 equipos en la tabla.</p>';
  } else {
    html += '<div class="bracket-grid">' + renderCruce(teamObj, small[0], 9, small[small.length-1], 8+small.length) + '</div>';
  }

  html += '<p class="empty" style="padding-top:18px">Cruces según la posición actual en la tabla; pueden cambiar hasta que termine la fase de liga.</p>';
  return html;
}

    var tabsWrap = document.querySelector('.tabs-wrap');

    if(tabsWrap && tabsNav){

        var atEnd = tabsNav.scrollLeft + tabsNav.clientWidth >= tabsNav.scrollWidth - 4;

function renderDestacados(state){
  var d = state.destacados || {fecha:null, jugadores:[]};
  var jugadores = d.jugadores || [];
  if(!jugadores.length){
    return '<p class="empty">Todavía no se cargó el equipo ideal de la fecha. Se agrega desde "Editar".</p>';
  }
  var teamObj = {};
  (state.equipos||[]).forEach(function(e){ teamObj[e.id]=e; });

  function cardHtml(j){
    var team = teamObj[j.equipoId];
    var photoHtml = j.foto
      ? '<img class="destacado-photo" src="'+j.foto+'" alt="'+escapeHtml(j.nombre)+'">'
      : '<div class="destacado-photo placeholder">'+escapeHtml(initials(j.nombre))+'</div>';
    var badgeHtml = team ? teamAvatar(team,'destacado-team-badge') : '';
    var masterHtml = j.mejorMaster ? '<div class="destacado-master-badge">⭐ Mejor Master</div>' : '';
    return '<div class="destacado-card">'
      + '<div class="destacado-photo-wrap">'+photoHtml+badgeHtml+'</div>'
      + '<div class="destacado-name">'+escapeHtml(j.nombre)+'</div>'
      + '<div class="destacado-pos">'+escapeHtml(posicionLabel(j.posicion))+'</div>'
      + masterHtml
      + '</div>';
  }
  function byPos(pos){ return jugadores.filter(function(j){ return j.posicion===pos; }); }

  var rows = '';
  var delanteros = byPos('delantero'), medios = byPos('medio'), defensas = byPos('defensa'), arqueros = byPos('arquero');
  if(delanteros.length) rows += '<div class="destacados-row">'+delanteros.map(cardHtml).join('')+'</div>';
  if(medios.length) rows += '<div class="destacados-row">'+medios.map(cardHtml).join('')+'</div>';
  if(defensas.length) rows += '<div class="destacados-row">'+defensas.map(cardHtml).join('')+'</div>';
  if(arqueros.length) rows += '<div class="destacados-row">'+arqueros.map(cardHtml).join('')+'</div>';
  var otros = jugadores.filter(function(j){ return ['delantero','medio','defensa','arquero'].indexOf(j.posicion)===-1; });
  if(otros.length) rows += '<div class="destacados-row">'+otros.map(cardHtml).join('')+'</div>';

  return '<div class="colabora-hero"><h3 class="colabora-title">⭐ Equipo Ideal de la Fecha</h3>'
    + (d.fecha ? '<p class="colabora-msg">Fecha '+d.fecha+'</p>' : '')
    + (d.formacion ? '<p class="destacados-formacion">Formación: '+escapeHtml(d.formacion)+'</p>' : '')
    + '</div>'
    + '<div class="destacados-pitch">'
    + '<div class="pitch-marking pitch-halfline"></div>'
    + '<div class="pitch-marking pitch-circle"></div>'
    + '<div class="pitch-marking pitch-spot"></div>'
    + '<div class="pitch-marking pitch-box"></div>'
    + rows + '</div>';
}

function buildEquipoOptions(state, selectedId){
  return (state.equipos||[]).map(function(e){
    return '<option value="'+e.id+'"'+(e.id===selectedId?' selected':'')+'>'+escapeHtml(e.nombre)+'</option>';
  }).join('');
}
function buildPosOptions(selected){
  return ['arquero','defensa','medio','delantero'].map(function(p){
    return '<option value="'+p+'"'+(p===selected?' selected':'')+'>'+posicionLabel(p)+'</option>';
  }).join('');
}

function renderFooter(state){

  if(s.instagram){
    links.push({icon:icons.instagram, url:'https://instagram.com/'+s.instagram.replace(/^@/,''), name:'Instagram'});
  }
  if(s.tiktok){
    links.push({icon:icons.tiktok, url:'https://tiktok.com/@'+s.tiktok.replace(/^@/,''), name:'TikTok'});
  }

    links.push({icon:icons.facebook, url:s.facebook, name:'Facebook'});

    return '<a class="social-badge" href="'+escapeHtml(l.url)+'" target="_blank" rel="noopener noreferrer" title="'+escapeHtml(l.name)+'">'+inner+'</a>';

function renderDocument(state){
  var json = JSON.stringify(state).replace(/</g, '\\u003c');

    + '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n'
    + '<meta http-equiv="Pragma" content="no-cache">\n'
    + '<meta http-equiv="Expires" content="0">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n</head>\n<body>\n'
    + '<div id="root"></div>\n'

}

      (STATE.equipos||[]).forEach(function(e){ teamName[e.id]=e.nombre; });

  setDestacadoFoto: function(id, inputEl){

    if(!file) return;
    var j = ((STATE.destacados && STATE.destacados.jugadores) || []).find(function(x){ return x.id===id; });
    if(!j) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var size = 260;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var side = Math.min(img.width, img.height);
        var sx = (img.width-side)/2, sy = (img.height-side)/2;
        ctx.save();
        ctx.beginPath();
        ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        ctx.restore();
        j.foto = canvas.toDataURL('image/png');
        DIRTY = true; render();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);

    var btn = document.getElementById('btn-descargar');
    var original = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Preparando…'; }
    Promise.resolve(window.claude ? claude.use('downloads') : null).then(function(downloads){
      if(!downloads){
        if(btn){ btn.textContent = 'No disponible acá'; setTimeout(function(){ btn.disabled=false; btn.textContent=original; }, 2500); }
        return;
      }
      var doc = renderDocument(STATE);
      return downloads.save({filename:'index.html', data: doc}).then(function(){
        if(btn){ btn.textContent = '✓ Descargado'; setTimeout(function(){ btn.disabled=false; btn.textContent=original; }, 2000); }
      });
    }).catch(function(err){
      if(btn){
        btn.textContent = (err && err.code==='declined') ? original : 'Error, probá de nuevo';
        btn.disabled = false;
        if(err && err.code!=='declined'){ setTimeout(function(){ btn.textContent=original; }, 2500); }
      }
    });
  },
  descartar: function(){ location.reload(); },
  publicar: function(){
    var btns = document.querySelectorAll('.save-bar .btn');
    btns.forEach(function(b){ b.disabled = true; });
    Promise.resolve(window.claude ? claude.use('artifact') : null).then(function(artifact){
      if(!artifact){ alert('No se pudo conectar con la función de publicación en esta vista.'); btns.forEach(function(b){ b.disabled=false; }); return; }
      return artifact.publish(renderDocument(STATE));
    }).catch(function(err){
      if(err && err.code==='not_writer'){ alert('No tenés permisos para editar esta página.'); }
      else if(err && err.code==='conflict'){ /* la vista se recarga sola */ }
      else { alert('No se pudo publicar. Probá de nuevo.'); }
      btns.forEach(function(b){ b.disabled=false; });
    });
  }
};

    var heartEl = document.getElementById('like-heart');
    var countEl = document.getElementById('like-count');
    if(heartEl) heartEl.textContent = liked ? '❤️' : '🤍';
    if(countEl) countEl.textContent = (count==null ? '' : count);
  }

  fetch(base + '/likes.json').then(function(r){ return r.json(); }).then(function(val){
    updateUI(typeof val==='number' ? val : 0, isLiked());
  }).catch(function(){ updateUI(null, isLiked()); });

  var busy = false;
  var btn = document.getElementById('like-btn');
  btn.addEventListener('click', function(){
    if(busy) return;
    busy = true;
    var liked = isLiked();
    var delta = liked ? -1 : 1;
    btn.classList.add('like-pop');
    setTimeout(function(){ btn.classList.remove('like-pop'); }, 400);
    fetch(base + '/likes.json', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({'.sv':{'increment': delta}})
    }).then(function(r){ return r.json(); }).then(function(newVal){
      setLiked(!liked);
      updateUI(typeof newVal==='number' ? newVal : null, !liked);
      busy = false;
    }).catch(function(){ busy = false; });
  });
}

var SWIPE_TAB_ORDER = ['posiciones','destacados','resultados','partidos','goleadores','tarjetas','liguilla'];

function initSwipeNav(){
  var root = document.getElementById('root');
  if(!root || root.dataset.swipeBound) return;
  root.dataset.swipeBound = '1';
  var startX=0, startY=0, tracking=false;
  root.addEventListener('touchstart', function(e){
    if(e.touches.length!==1){ tracking=false; return; }
    var t = e.target;
    if(t.closest && (t.closest('nav.tabs') || t.closest('input') || t.closest('select') || t.closest('textarea'))){
      tracking=false; return;
    }
    var scrollableWrap = t.closest && t.closest('.tablewrap');
    if(scrollableWrap && scrollableWrap.scrollWidth > scrollableWrap.clientWidth + 2){
      tracking=false; return;
    }
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; tracking=true;
  }, {passive:true});
  root.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking=false;
    var touch = e.changedTouches[0];
    var dx = touch.clientX - startX;
    var dy = touch.clientY - startY;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
      var idx = SWIPE_TAB_ORDER.indexOf(TAB);
      if(idx===-1) return;
      if(dx < 0 && idx < SWIPE_TAB_ORDER.length-1){ App.setTab(SWIPE_TAB_ORDER[idx+1]); }
      else if(dx > 0 && idx > 0){ App.setTab(SWIPE_TAB_ORDER[idx-1]); }
    }
  }, {passive:true});
}

(function init(){
  var userPromise = window.claude ? Promise.resolve(claude.use('user')).catch(function(){ return null; }) : Promise.resolve(null);
  userPromise.then(function(user){
    if(!user) { render(); initLikeWidget(); initSwipeNav(); return; }
    Promise.resolve(user.canEdit()).then(function(v){
      CAN_EDIT = !!v; render(); initLikeWidget(); initSwipeNav();
    }).catch(function(){ render(); initLikeWidget(); initSwipeNav(); });
  });
})();

})();
</script>
