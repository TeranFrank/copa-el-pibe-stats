var STYLE_CSS = `
:root{
  --bg:#0A0D09;
  --panel:#131A11;
  --panel-2:#1B2417;
  --line:#2C3A26;
  --text:#F2F4EF;

}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);

}

.wrap{max-width:960px;margin:0 auto;padding:0 20px 80px;}
.pitch-strip{height:8px;width:100%;background:repeating-linear-gradient(115deg, var(--accent-deep) 0 26px, #143a17 26px 52px);}
.hero{padding:28px 20px 0;border-bottom:1px solid var(--line);}
.hero-inner{display:flex;align-items:center;gap:16px;max-width:960px;margin:0 auto;flex-wrap:wrap;}
.hero-logo{width:56px;height:56px;border-radius:50%;flex:none;object-fit:cover;filter:drop-shadow(0 0 10px rgba(111,207,61,.25));}
.hero-text{min-width:0;}
.hero .torneo-name{font-size:clamp(26px,5.5vw,44px);text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px;line-height:1.02;word-break:break-word;}
.hero .sub{color:var(--muted);font-size:13px;padding-bottom:18px;}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:960px;margin:0 auto;}

  background:none;border:none;color:var(--muted);font-family:'Oswald',sans-serif;
  font-size:15px;text-transform:uppercase;letter-spacing:.03em;padding:12px 14px;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;
}

section.panel{padding:28px 0;}

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);}

.team-name{font-family:'Oswald',sans-serif;font-weight:500;}
.fecha-block{margin-bottom:26px;}
.fecha-title{font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px;}
.partido{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 2px;border-bottom:1px solid var(--line);}

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function loadState(){
  try { return JSON.parse(document.getElementById('state-data').textContent); }
  catch(e){ return {torneo:'Mi Campeonato', equipos:[], fechas:[], logo:null}; }
}

var STATE = loadState();
STATE.equipos = STATE.equipos || [];
STATE.fechas = STATE.fechas || [];
document.title = (STATE.torneo || 'Campeonato') + ' — Estadísticas';

var TAB = 'posiciones';
var CAN_EDIT = false;
var DIRTY = false;

function computeStandings(state){
  var map = {};
  (state.equipos||[]).forEach(function(e){
    map[e.id] = {id:e.id, nombre:e.nombre, pj:0,pg:0,pe:0,pp:0,gf:0,gc:0};
  });
  (state.fechas||[]).forEach(function(f){
    (f.partidos||[]).forEach(function(p){
      if(p.golesLocal==null || p.golesVisitante==null) return;
      var L = map[p.localId], V = map[p.visitanteId];
      if(!L||!V) return;
      var gl = Number(p.golesLocal), gv = Number(p.golesVisitante);
      L.pj++; V.pj++;
      L.gf+=gl; L.gc+=gv;
      V.gf+=gv; V.gc+=gl;
      if(gl>gv){ L.pg++; V.pp++; }
      else if(gl<gv){ V.pg++; L.pp++; }
      else { L.pe++; V.pe++; }
    });
  });
  var arr = Object.keys(map).map(function(k){
    var t = map[k];
    t.dg = t.gf - t.gc;
    t.pts = t.pg*3 + t.pe;
    return t;
  });
  arr.sort(function(a,b){
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.dg!==a.dg) return b.dg-a.dg;
    if(b.gf!==a.gf) return b.gf-a.gf;
    return a.nombre.localeCompare(b.nombre);
  });
  return arr;
}

function computeScorers(state){
  var map = {}, teamName = {};
  (state.equipos||[]).forEach(function(e){teamName[e.id]=e.nombre;});
  (state.fechas||[]).forEach(function(f){
    (f.partidos||[]).forEach(function(p){
      (p.goleadores||[]).forEach(function(g){
        var key = g.jugador.trim().toLowerCase()+'|'+g.equipoId;
        if(!map[key]) map[key]={jugador:g.jugador, equipoId:g.equipoId, goles:0};
        map[key].goles += Number(g.cantidad||1);
      });
    });
  });
  var arr = Object.keys(map).map(function(k){ return map[k]; });
  arr.forEach(function(x){ x.equipoNombre = teamName[x.equipoId] || '—'; });
  arr.sort(function(a,b){ if(b.goles!==a.goles) return b.goles-a.goles; return a.jugador.localeCompare(b.jugador); });
  return arr;
}

function computeCards(state){
  var map = {}, teamName = {};
  (state.equipos||[]).forEach(function(e){teamName[e.id]=e.nombre;});
  (state.fechas||[]).forEach(function(f){
    (f.partidos||[]).forEach(function(p){
      (p.tarjetas||[]).forEach(function(t){
        var key = t.jugador.trim().toLowerCase()+'|'+t.equipoId;
        if(!map[key]) map[key]={jugador:t.jugador, equipoId:t.equipoId, amarillas:0, rojas:0};
        if(t.tipo==='roja') map[key].rojas += Number(t.cantidad||1);
        else map[key].amarillas += Number(t.cantidad||1);
      });
    });
  });
  var arr = Object.keys(map).map(function(k){ return map[k]; });
  arr.forEach(function(x){ x.equipoNombre = teamName[x.equipoId] || '—'; });
  arr.sort(function(a,b){
    if(b.rojas!==a.rojas) return b.rojas-a.rojas;
    if(b.amarillas!==a.amarillas) return b.amarillas-a.amarillas;
    return a.jugador.localeCompare(b.jugador);
  });
  return arr;
}

function renderStandings(state){
  var rows = computeStandings(state);
  if(!rows.length) return '<p class="empty">Todavía no hay equipos cargados.</p>';
  var body = rows.map(function(t,i){
    return '<tr class="'+(i<3?'top3':'')+'">'
      + '<td class="num">'+(i+1)+'</td>'
      + '<td class="team-name">'+escapeHtml(t.nombre)+'</td>'
      + '<td class="num">'+t.pj+'</td>'
      + '<td class="num">'+t.pg+'</td>'
      + '<td class="num">'+t.pe+'</td>'
      + '<td class="num">'+t.pp+'</td>'
      + '<td class="num">'+t.gf+'</td>'
      + '<td class="num">'+t.gc+'</td>'
      + '<td class="num">'+(t.dg>0?'+':'')+t.dg+'</td>'
      + '<td class="num"><strong>'+t.pts+'</strong></td>'
      + '</tr>';
  }).join('');
  return '<div class="tablewrap"><table><thead><tr><th class="num">#</th><th>Equipo</th><th class="num">PJ</th><th class="num">PG</th>'
    + '<th class="num">PE</th><th class="num">PP</th><th class="num">GF</th><th class="num">GC</th>'
    + '<th class="num">DG</th><th class="num">Pts</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

function renderFixtures(state){
  var fechas = state.fechas||[];
  if(!fechas.length) return '<p class="empty">Todavía no hay partidos cargados.</p>';
  var teamName = {};
  (state.equipos||[]).forEach(function(e){teamName[e.id]=e.nombre;});
  return fechas.map(function(f){
    var partidos = (f.partidos||[]).map(function(p){
      var jugado = p.golesLocal!=null && p.golesVisitante!=null;
      var scoreHtml = jugado
        ? '<span class="score">'+p.golesLocal+' — '+p.golesVisitante+'</span>'
        : '<span class="score pending">vs</span>';
      var eventos = [];
      (p.goleadores||[]).forEach(function(g){
        eventos.push(escapeHtml(g.jugador)+' ⚽'+(g.cantidad>1?' x'+g.cantidad:''));
      });
      (p.tarjetas||[]).forEach(function(t){
        eventos.push('<span class="badge '+t.tipo+'"></span>'+escapeHtml(t.jugador));
      });
      var eventosHtml = eventos.length ? '<div class="events-line">'+eventos.join(' · ')+'</div>' : '<div style="margin-bottom:10px"></div>';
      return '<div class="partido">'
        + '<div class="equipo-col">'+escapeHtml(teamName[p.localId]||'?')+'</div>'
        + scoreHtml
        + '<div class="equipo-col right">'+escapeHtml(teamName[p.visitanteId]||'?')+'</div>'
        + '</div>' + eventosHtml;
    }).join('');
    return '<div class="fecha-block"><h3 class="fecha-title">Fecha '+f.numero+'</h3>'+(partidos||'<p class="empty">Sin partidos.</p>')+'</div>';
  }).join('');
}

function renderScorers(state){
  var rows = computeScorers(state);
  if(!rows.length) return '<p class="empty">Todavía no hay goles cargados.</p>';
  var body = rows.map(function(s,i){
    return '<tr><td class="num">'+(i+1)+'</td><td>'+escapeHtml(s.jugador)+'</td>'
      + '<td class="team-name">'+escapeHtml(s.equipoNombre)+'</td><td class="num"><strong>'+s.goles+'</strong></td></tr>';
  }).join('');
  return '<div class="tablewrap"><table><thead><tr><th class="num">#</th><th>Jugador</th><th>Equipo</th><th class="num">Goles</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

function renderCards(state){
  var rows = computeCards(state);
  if(!rows.length) return '<p class="empty">Todavía no hay tarjetas cargadas.</p>';
  var body = rows.map(function(s,i){
    return '<tr><td class="num">'+(i+1)+'</td><td>'+escapeHtml(s.jugador)+'</td>'
      + '<td class="team-name">'+escapeHtml(s.equipoNombre)+'</td><td class="num">'+s.amarillas+'</td><td class="num">'+s.rojas+'</td></tr>';
  }).join('');
  return '<div class="tablewrap"><table><thead><tr><th class="num">#</th><th>Jugador</th><th>Equipo</th><th class="num">Am.</th><th class="num">Roj.</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

function renderPartidoAdmin(state, f, p){
  var teamName = {};
  (state.equipos||[]).forEach(function(e){teamName[e.id]=e.nombre;});
  var goleadoresHtml = (p.goleadores||[]).map(function(g,i){
    return '<span class="chip">⚽ '+escapeHtml(g.jugador)+(g.cantidad>1?' x'+g.cantidad:'')+' ('+escapeHtml(teamName[g.equipoId]||'?')+')'
      + ' <button onclick="App.removeGol(\''+f.id+'\',\''+p.id+'\','+i+')">×</button></span>';
  }).join('');
  var tarjetasHtml = (p.tarjetas||[]).map(function(t,i){
    return '<span class="chip"><span class="badge '+t.tipo+'"></span>'+escapeHtml(t.jugador)+' ('+escapeHtml(teamName[t.equipoId]||'?')+')'
      + ' <button onclick="App.removeTarjeta(\''+f.id+'\',\''+p.id+'\','+i+')">×</button></span>';
  }).join('');
  return '<div class="match-admin">'
    + '<div class="row">'
    + '<strong>'+escapeHtml(teamName[p.localId]||'?')+'</strong>'
    + '<input type="number" min="0" value="'+(p.golesLocal==null?'':p.golesLocal)+'" onchange="App.updateScore(\''+f.id+'\',\''+p.id+'\',\'golesLocal\',this.value)">'
    + '<span>—</span>'
    + '<input type="number" min="0" value="'+(p.golesVisitante==null?'':p.golesVisitante)+'" onchange="App.updateScore(\''+f.id+'\',\''+p.id+'\',\'golesVisitante\',this.value)">'
    + '<strong>'+escapeHtml(teamName[p.visitanteId]||'?')+'</strong>'
    + '<button class="btn danger" onclick="App.removePartido(\''+f.id+'\',\''+p.id+'\')">Eliminar partido</button>'
    + '</div>'
    + '<div>'+goleadoresHtml+'</div>'
    + '<div class="row">'
    + '<input type="text" id="gol-jug-'+p.id+'" placeholder="Jugador">'
    + '<select id="gol-eq-'+p.id+'"><option value="'+p.localId+'">'+escapeHtml(teamName[p.localId]||'?')+'</option>'
    + '<option value="'+p.visitanteId+'">'+escapeHtml(teamName[p.visitanteId]||'?')+'</option></select>'
    + '<input type="number" id="gol-cant-'+p.id+'" value="1" min="1">'
    + '<button class="btn secondary" onclick="App.addGol(\''+f.id+'\',\''+p.id+'\')">+ Gol</button>'
    + '</div>'
    + '<div>'+tarjetasHtml+'</div>'
    + '<div class="row">'
    + '<input type="text" id="tar-jug-'+p.id+'" placeholder="Jugador">'
    + '<select id="tar-eq-'+p.id+'"><option value="'+p.localId+'">'+escapeHtml(teamName[p.localId]||'?')+'</option>'
    + '<option value="'+p.visitanteId+'">'+escapeHtml(teamName[p.visitanteId]||'?')+'</option></select>'
    + '<select id="tar-tipo-'+p.id+'"><option value="amarilla">Amarilla</option><option value="roja">Roja</option></select>'
    + '<button class="btn secondary" onclick="App.addTarjeta(\''+f.id+'\',\''+p.id+'\')">+ Tarjeta</button>'
    + '</div>'
    + '</div>';
}

function renderAdmin(state){
  var equiposChips = (state.equipos||[]).map(function(e){
    return '<span class="chip">'+escapeHtml(e.nombre)+' <button onclick="App.removeEquipo(\''+e.id+'\')" title="Quitar equipo">×</button></span>';
  }).join('') || '<p class="empty">Todavía no cargaste equipos.</p>';

  var equipoOptions = (state.equipos||[]).map(function(e){
    return '<option value="'+e.id+'">'+escapeHtml(e.nombre)+'</option>';
  }).join('');

  var fechasHtml = (state.fechas||[]).map(function(f){
    var partidosHtml = (f.partidos||[]).map(function(p){ return renderPartidoAdmin(state, f, p); }).join('')
      || '<p class="empty">Sin partidos en esta fecha.</p>';
    var addPartido = (state.equipos||[]).length>=2 ? (
      '<div class="row">'
      + '<select id="sel-local-'+f.id+'">'+equipoOptions+'</select>'
      + '<span style="color:var(--muted)">vs</span>'
      + '<select id="sel-visit-'+f.id+'">'+equipoOptions+'</select>'
      + '<button class="btn secondary" onclick="App.addPartido(\''+f.id+'\')">Agregar partido</button>'
      + '</div>'
    ) : '<p class="empty">Cargá al menos dos equipos para agregar partidos.</p>';
    return '<div class="admin-box"><h3>Fecha '+f.numero+' <button class="btn danger" onclick="App.removeFecha(\''+f.id+'\')">Eliminar fecha</button></h3>'
      + partidosHtml + addPartido + '</div>';
  }).join('');

  return ''
    + '<div class="admin-box"><h3>Nombre del torneo</h3>'
    + '<div class="row"><input type="text" id="input-torneo" value="'+escapeHtml(state.torneo||'')+'" style="flex:1;min-width:200px" onchange="App.setTorneo(this.value)"></div></div>'
    + '<div class="admin-box"><h3>Equipos</h3><div>'+equiposChips+'</div>'
    + '<div class="row"><input type="text" id="input-equipo" placeholder="Nombre del equipo"><button class="btn" onclick="App.addEquipo()">Agregar equipo</button></div></div>'
    + '<div class="admin-box"><h3>Fechas y partidos</h3>'+fechasHtml
    + '<button class="btn secondary" onclick="App.addFecha()">Agregar fecha</button></div>';
}

function render(){
  var tabsList = [
    ['posiciones','Posiciones'],
    ['partidos','Partidos'],
    ['goleadores','Goleadores'],
    ['tarjetas','Tarjetas']
  ];
  if(CAN_EDIT) tabsList.push(['admin','Editar']);

  var tabsHtml = tabsList.map(function(t){
    return '<button class="'+(TAB===t[0]?'active':'')+'" onclick="App.setTab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');

  var content = '';
  if(TAB==='posiciones') content = renderStandings(STATE);
  else if(TAB==='partidos') content = renderFixtures(STATE);
  else if(TAB==='goleadores') content = renderScorers(STATE);
  else if(TAB==='tarjetas') content = renderCards(STATE);
  else if(TAB==='admin') content = renderAdmin(STATE);
  else content = renderStandings(STATE);

  var saveBar = (CAN_EDIT && TAB==='admin') ? (
    '<div class="save-bar">'
    + (DIRTY ? '<span class="dirty-note">Tenés cambios sin publicar</span>' : '<span></span>')
    + '<button class="btn secondary" onclick="App.descartar()">Descartar</button>'
    + '<button class="btn" '+(DIRTY?'':'disabled')+' onclick="App.publicar()">Publicar cambios</button>'
    + '</div>'
  ) : '';

  var logoHtml = STATE.logo ? ('<img class="hero-logo" src="'+STATE.logo+'" alt="Logo">') : '';

  document.getElementById('root').innerHTML = ''
    + '<div class="pitch-strip"></div>'
    + '<div class="hero"><div class="hero-inner">'+logoHtml+'<div class="hero-text"><h1 class="torneo-name">'+escapeHtml(STATE.torneo||'Campeonato')+'</h1>'
    + '<div class="sub">Tabla de posiciones, partidos, goleadores y tarjetas</div></div></div>'
    + '<nav class="tabs">'+tabsHtml+'</nav></div>'
    + '<div class="wrap"><section class="panel">'+content+'</section></div>'
    + saveBar;
}

function renderDocument(state){
  var json = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="UTF-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n</head>\n<body>\n'
    + '<div id="root"></div>\n'
    + '<script id="state-data" type="application/json">'+json+'<'+'/script>\n'
    + '<script>'+SELF+'<'+'/script>\n'
    + '</body>\n</html>';
}

window.App = {
  setTab: function(t){ TAB=t; render(); },
  setTorneo: function(v){ STATE.torneo=v; DIRTY=true; render(); },
  addEquipo: function(){
    var el = document.getElementById('input-equipo');
    var name = (el.value||'').trim();
    if(!name) return;
    STATE.equipos.push({id: uid('eq'), nombre: name});
    DIRTY = true; render();
  },
  removeEquipo: function(id){
    STATE.equipos = STATE.equipos.filter(function(e){ return e.id!==id; });
    DIRTY = true; render();
  },
  addFecha: function(){
    var nums = STATE.fechas.map(function(f){ return f.numero; });
    var nextNum = nums.length ? Math.max.apply(null, nums)+1 : 1;
    STATE.fechas.push({id: uid('f'), numero: nextNum, partidos: []});
    DIRTY = true; render();
  },
  removeFecha: function(id){
    STATE.fechas = STATE.fechas.filter(function(f){ return f.id!==id; });
    DIRTY = true; render();
  },
  addPartido: function(fechaId){
    var f = STATE.fechas.find(function(x){ return x.id===fechaId; });
    if(!f) return;
    var localSel = document.getElementById('sel-local-'+fechaId);
    var visitSel = document.getElementById('sel-visit-'+fechaId);
    if(!localSel || !visitSel) return;
    var localId = localSel.value, visitId = visitSel.value;
    if(!localId || !visitId || localId===visitId){ alert('Elegí dos equipos distintos.'); return; }
    f.partidos.push({id: uid('p'), localId: localId, visitanteId: visitId, golesLocal:null, golesVisitante:null, goleadores:[], tarjetas:[]});
    DIRTY = true; render();
  },
  removePartido: function(fechaId, partidoId){
    var f = STATE.fechas.find(function(x){ return x.id===fechaId; });
    if(!f) return;
    f.partidos = f.partidos.filter(function(p){ return p.id!==partidoId; });
    DIRTY = true; render();
  },
  updateScore: function(fechaId, partidoId, campo, value){
    var f = STATE.fechas.find(function(x){ return x.id===fechaId; });
    if(!f) return;
    var p = f.partidos.find(function(x){ return x.id===partidoId; });
    if(!p) return;
    p[campo] = value==='' ? null : Math.max(0, parseInt(value,10)||0);
    DIRTY = true; render();
  },
  addGol: function(fechaId, partidoId){
    var f = STATE.fechas.find(function(x){ return x.id===fechaId; });
    if(!f) return;
    var p = f.partidos.find(function(x){ return x.id===partidoId; });
    if(!p) return;
    var jugEl = document.getElementById('gol-jug-'+partidoId);
    var eqEl = document.getElementById('gol-eq-'+partidoId);
    var cantEl = document.getElementById('gol-cant-'+partidoId);
    var jugador = (jugEl.value||'').trim();
    if(!jugador) return;
    p.goleadores.push({jugador: jugador, equipoId: eqEl.value, cantidad: Math.max(1, parseInt(cantEl.value,10)||1)});
    DIRTY = true; render();
  },
  removeGol: function(fechaId, partidoId, idx){
    var f = STATE.fechas.find(function(x){ return x.id===fechaId; });
    if(!f) return;
    var p = f.partidos.find(function(x){ return x.id===partidoId; });
    if(!p) return;
    p.goleadores.splice(idx,1);
    DIRTY = true; render();
  },
  addTarjeta: function(fechaId, partidoId){
    var f = STATE.fechas.find(function(x){ return x.id===fechaId; });
    if(!f) return;
    var p = f.partidos.find(function(x){ return x.id===partidoId; });
    if(!p) return;
    var jugEl = document.getElementById('tar-jug-'+partidoId);
    var eqEl = document.getElementById('tar-eq-'+partidoId);
    var tipoEl = document.getElementById('tar-tipo-'+partidoId);
    var jugador = (jugEl.value||'').trim();
    if(!jugador) return;
    p.tarjetas.push({jugador: jugador, equipoId: eqEl.value, tipo: tipoEl.value, cantidad:1});
    DIRTY = true; render();
  },
  removeTarjeta: function(fechaId, partidoId, idx){
    var f = STATE.fechas.find(function(x){ return x.id===fechaId; });
    if(!f) return;
    var p = f.partidos.find(function(x){ return x.id===partidoId; });
    if(!p) return;
    p.tarjetas.splice(idx,1);
    DIRTY = true; render();
  },
  descartar: function(){ location.reload(); },
  publicar: function(){
    var btns = document.querySelectorAll('.save-bar .btn');
    btns.forEach(function(b){ b.disabled = true; });
    Promise.resolve(window.claude ? claude.use('artifact') : null).then(function(artifact){
      if(!artifact){ alert('No se pudo conectar con la función de publicación en esta vista.'); btns.forEach(function(b){ b.disabled=false; }); return; }
      return artifact.publish(renderDocument(STATE));
    }).catch(function(err){
      if(err && err.code==='not_writer'){ alert('No tenés permisos para editar esta página.'); }
      else if(err && err.code==='conflict'){ /* la vista se recarga sola */ }
      else { alert('No se pudo publicar. Probá de nuevo.'); }
      btns.forEach(function(b){ b.disabled=false; });
    });
  }
};

(function init(){
  var userPromise = window.claude ? Promise.resolve(claude.use('user')).catch(function(){ return null; }) : Promise.resolve(null);
  userPromise.then(function(user){
    if(!user) { render(); return; }
    Promise.resolve(user.canEdit()).then(function(v){
      CAN_EDIT = !!v; render();
    }).catch(function(){ render(); });
  });
})();

})();
</script>
</body>
